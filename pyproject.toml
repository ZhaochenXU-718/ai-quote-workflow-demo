# Python backend project config. Managed with uv (see README.md).
# The environment is reproducible across machines via `.python-version`
# (pins the interpreter) and `uv.lock` (pins dependencies). Run `uv sync`.
[project]
name = "ai-quote-workflow-demo"
version = "0.1.0"
description = "Manufacturing-export inquiry-to-quote AI workflow demo (deterministic P1 pipeline + evaluation harness)."
requires-python = ">=3.12"
# Runtime dependencies currently use only the Python standard library. Add
# them here (e.g. an LLM client for P5) and run `uv lock` / `uv sync`.
dependencies = []

[dependency-groups]
# Dev-only tooling. Install with `uv sync` (groups are installed by default).
dev = []

[tool.uv]
package = false
